<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Страница не найдена · Михалыч AI</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 120% 55% at 60% 0%,   rgba(80, 150, 230, 0.28) 0%, transparent 60%),
      radial-gradient(ellipse  80% 45% at 100% 0%,  rgba(40, 100, 210, 0.20) 0%, transparent 55%),
      radial-gradient(ellipse  90% 50% at 0%  100%, rgba(220, 120, 80, 0.16) 0%, transparent 55%),
      #060C18;
    color: #E6E8EC;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(80px, 18vw, 160px);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #00E5FF 0%, #5BBCFF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 16px;
  }
  h1 { font-size: clamp(22px, 4vw, 32px); margin: 0 0 12px; letter-spacing: -0.02em; }
  p  { color: #8A92A3; margin: 0 0 36px; font-size: 17px; max-width: 40ch; }
  a.btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px; border-radius: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    background: #00E5FF; color: #001014;
    text-decoration: none;
    box-shadow: 0 0 0 1px #00E5FF, 0 18px 48px -12px rgba(0,229,255,0.45);
    transition: transform .15s;
  }
  a.btn:hover { transform: translateY(-2px); }
  .img { width: clamp(80px, 15vw, 120px); margin-bottom: 28px; opacity: 0.85; }
</style>
</head>
<body>
  <img src="ai_assistant_main.webp" alt="Михалыч" class="img" />
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Михалыч искал, но не нашёл. Зато главная страница точно на месте.</p>
  <a class="btn" href="/">← На главную</a>
